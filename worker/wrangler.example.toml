name = "stubble-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Rate limiting KV namespace — create with:
# wrangler kv:namespace create "RATE_LIMITS"
# Then paste the ID below.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "YOUR_KV_NAMESPACE_ID"

# Environment variables (set via `wrangler secret put` for sensitive values):
# - GEMINI_API_KEY: Your Google Gemini API key (secret)
# - SUPABASE_ANON_KEY: Supabase anon/public key (secret)
# - SUPABASE_URL: Your Supabase project URL (can be set as var below)

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
