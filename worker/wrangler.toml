name = "stubble-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Rate limiting KV namespace — create with:
# wrangler kv:namespace create "RATE_LIMITS"
# Then paste the ID below.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "63d5ec7d30d44bb79de6ae526dab6321"

# Environment secrets (set via `wrangler secret put`):
# - GEMINI_API_KEY: Your Google Gemini API key
# - SUPABASE_ANON_KEY: Supabase anon/public key (for user lookup fallback)

[vars]
ENVIRONMENT = "production"
